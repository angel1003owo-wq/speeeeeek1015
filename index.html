<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神奇成語大冒險 - 聲控解謎小勇士 🗡️✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        game: {
                            bg: '#FFFDF0',
                            yellow: '#FFDF00',
                            orange: '#FF8800',
                            peach: '#FF6F61',
                            green: '#4CAF50',
                            sky: '#00B4DB',
                            purple: '#9B51E0',
                            cardBg: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        rounded: ['"M PLUS Rounded 1c"', '"Noto Sans TC"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
            background-color: #FFFDF0;
            background-image: 
                radial-gradient(#FFE885 1.5px, transparent 1.5px), 
                radial-gradient(#FFC947 1.5px, #FFFDF0 1.5px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }

        /* Active microphone pulse effect */
        .mic-active {
            animation: pulse-ring 1.2s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 111, 97, 0.6);
            }
            70% {
                box-shadow: 0 0 0 18px rgba(255, 111, 97, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 111, 97, 0);
            }
        }

        /* Glowing puzzle tile animation */
        .glow-correct {
            animation: glowGlow 0.8s ease-in-out alternate infinite;
        }

        @keyframes glowGlow {
            from {
                box-shadow: 0 0 10px #FFDF00, 0 0 20px #FF8800;
            }
            to {
                box-shadow: 0 0 20px #FFDF00, 0 0 35px #FF8800;
            }
        }

        /* Bounce for cards */
        .bounce-card {
            animation: bounceSoft 2s infinite ease-in-out;
        }

        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        ruby {
            ruby-position: over;
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: flex-end;
            margin: 0.15em 0.2em;
            padding: 0.25em 0.4em;
            background: #FFF9E6;
            border-radius: 0.8rem;
            border: 2px solid #FFE082;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        ruby:hover {
            transform: scale(1.08);
            background: #FFE082;
        }

        rt {
            font-size: 0.55em;
            color: #D84315;
            font-weight: 800;
        }

        rb {
            font-size: 1.4em;
            font-weight: 900;
            color: #2C3E50;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between relative overflow-x-hidden">

    <!-- Header Navigation Bar -->
    <header class="w-full bg-white/95 backdrop-blur-md border-b-4 border-amber-300 sticky top-0 z-40 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between flex-wrap gap-2">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-400 to-amber-200 flex items-center justify-center text-2xl shadow-md border-2 border-amber-300 transform hover:rotate-6 transition-transform">
                    🗡️
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-amber-900 tracking-wide flex items-center gap-2">
                        神奇成語大冒險
                        <span class="text-xs bg-red-100 text-red-600 font-bold px-2.5 py-0.5 rounded-full border border-red-200 hidden sm:inline-block">🎤 聲控解謎版</span>
                    </h1>
                    <p class="text-xs text-amber-700/80 font-bold">小勇士聽說讀寫‧成語大挑戰</p>
                </div>
            </div>

            <!-- External Link Button to Zhuyin/Poetry Playground -->
            <a href="index.html" target="_blank" rel="noopener noreferrer" title="前往唐詩朗讀小學堂主頁面" class="flex items-center gap-2 bg-gradient-to-r from-teal-400 to-emerald-500 hover:from-teal-500 hover:to-emerald-600 text-white px-4 py-2 rounded-2xl font-black text-xs sm:text-sm shadow-md hover:shadow-lg transform hover:-translate-y-0.5 active:scale-95 transition-all border-2 border-emerald-200">
                <span class="text-base">🔗</span>
                <div class="text-left leading-tight">
                    <div class="text-[10px] text-teal-100 font-bold">前往更多資源</div>
                    <div>唐詩朗讀小學堂 🪄</div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-emerald-100 ml-1"></i>
            </a>

        </div>
    </header>

    <!-- Main Game Area -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow flex flex-col gap-6">

        <!-- Scoreboard Bar -->
        <section class="grid grid-cols-3 gap-3 sm:gap-4">
            <div class="bg-white rounded-2xl p-3 shadow-md border-3 border-amber-200 flex flex-col items-center justify-center text-center">
                <span class="text-xs font-bold text-slate-500">🏆 目前得分</span>
                <span id="scoreDisplay" class="text-2xl sm:text-3xl font-black text-amber-500">0</span>
            </div>
            <div class="bg-white rounded-2xl p-3 shadow-md border-3 border-amber-200 flex flex-col items-center justify-center text-center">
                <span class="text-xs font-bold text-slate-500">🔥 連勝紀錄</span>
                <span id="streakDisplay" class="text-2xl sm:text-3xl font-black text-orange-500">0</span>
            </div>
            <div class="bg-white rounded-2xl p-3 shadow-md border-3 border-amber-200 flex flex-col items-center justify-center text-center">
                <span class="text-xs font-bold text-slate-500">🚩 通過關卡</span>
                <span id="levelDisplay" class="text-2xl sm:text-3xl font-black text-emerald-500">1/5</span>
            </div>
        </section>

        <!-- Main Game Card -->
        <section id="gameCard" class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-amber-300 flex flex-col gap-6 relative">
            
            <!-- Category Badge & Teacher Voice Button -->
            <div class="flex items-center justify-between flex-wrap gap-2">
                <span id="categoryBadge" class="bg-amber-100 text-amber-800 border border-amber-300 font-black text-xs px-3 py-1.5 rounded-full">
                    🏷️ 分類：國小常用成語
                </span>

                <button onclick="readIdiomFull()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold text-xs border border-sky-300 transition-all">
                    <i class="fa-solid fa-volume-high"></i>
                    <span>聽老師示範朗讀</span>
                </button>
            </div>

            <!-- Missing Idiom Display Tiles -->
            <div id="idiomContainer" class="flex items-center justify-center gap-3 sm:gap-5 py-4">
                <!-- Dynamically populated idiom character cards -->
            </div>

            <!-- Fill-in Prompt Sentence -->
            <div class="bg-amber-50/80 rounded-2xl p-4 border-2 border-amber-200/80 text-center">
                <div class="text-xs font-bold text-amber-700 mb-1">💡 題目例句與釋義填空：</div>
                <div id="sentenceDisplay" class="text-base sm:text-lg font-bold text-slate-700 leading-relaxed">
                    <!-- Dynamic Sentence -->
                </div>
            </div>

            <!-- Speech Voice Input Area -->
            <div class="flex flex-col items-center justify-center gap-3 pt-2">
                
                <button id="micBtn" onclick="toggleVoiceRecognition()" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-tr from-rose-500 to-amber-400 hover:from-rose-600 hover:to-amber-500 text-white text-3xl shadow-lg flex items-center justify-center transition-transform transform active:scale-90 relative">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                </button>

                <div class="text-center">
                    <p id="speechStatus" class="font-extrabold text-slate-700 text-sm sm:text-base">
                        點擊大麥克風，對著手機/電腦說出缺失的字的讀音！
                    </p>
                    <p id="transcriptPreview" class="text-xs font-bold text-rose-500 h-5 mt-1">
                        <!-- Recognized text will appear here -->
                    </p>
                </div>
            </div>

            <!-- Alternative Choice / Hint Controls -->
            <div class="flex items-center justify-between border-t-2 border-amber-100 pt-4 gap-2 flex-wrap">
                <button onclick="giveHint()" class="px-4 py-2 rounded-xl bg-purple-100 hover:bg-purple-200 text-purple-800 font-bold text-xs border border-purple-300 transition-all flex items-center gap-1">
                    <span>💡 提示成語第一個字</span>
                </button>

                <!-- Keyboard Manual Option for Non-Voice Devices -->
                <div class="flex items-center gap-2">
                    <input type="text" id="manualInput" placeholder="或手動輸入答案" class="px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-amber-200 focus:outline-none focus:border-amber-400 w-32">
                    <button onclick="checkManualAnswer()" class="px-3 py-1.5 rounded-xl bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-xs transition-all">
                        送出
                    </button>
                </div>
            </div>

        </section>

        <!-- Idiom Detail Modal / Popup -->
        <div id="resultModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full border-4 border-amber-300 shadow-2xl flex flex-col gap-4 text-center transform animate-bounce-short">
                <div class="text-5xl">🎉</div>
                <h2 id="modalTitle" class="text-2xl font-black text-amber-900">恭喜答對了！</h2>
                
                <div id="modalIdiomBox" class="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200 flex justify-center gap-2">
                    <!-- Ruby Idiom Display -->
                </div>

                <p id="modalMeaning" class="text-xs sm:text-sm font-bold text-slate-600 bg-slate-50 p-3 rounded-xl text-left border">
                    <!-- Meaning -->
                </p>

                <button onclick="nextLevel()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-base shadow-lg transition-all">
                    下一關卡 🚀
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs font-bold text-amber-800/60 bg-amber-100/50 border-t border-amber-200">
        <p>🗡️ 神奇成語大冒險 ‧ 國小生聲控語文解謎小學堂</p>
    </footer>

    <!-- Game Logic -->
    <script>
        /* Elementary School Grade 3-6 Idiom Database */
        const IDIOM_DATABASE = [
            {
                idiom: "一心一意",
                zhuyin: ["ㄧ", "ㄒㄧㄣ", "ㄧ", "ㄧˋ"],
                missingIndex: 1, // Missing "心"
                meaning: "形容心思專一，專心致志，毫無雜念。",
                example: "他在學習時總是［？］，所以成績非常優秀。",
                category: "學習專注"
            },
            {
                idiom: "守株待兔",
                zhuyin: ["ㄕㄡˇ", "ㄓㄨ", "ㄉㄞˋ", "ㄊㄨˋ"],
                missingIndex: 3, // Missing "兔"
                meaning: "比喻拘泥守舊，不知變通；或企圖不經過努力而僥倖獲得成功。",
                example: "如果我們不主動尋找機會，只會［？］，是不可能成功的。",
                category: "寓言故事"
            },
            {
                idiom: "溫故知新",
                zhuyin: ["ㄨㄣ", "ㄍㄨˋ", "ㄓ", "ㄒㄧㄣ"],
                missingIndex: 0, // Missing "溫"
                meaning: "複習過去學過的知識，能從中有新的體會與收穫。",
                example: "每天晚上回家［？］，是維持好成績的不二法門。",
                category: "學習態度"
            },
            {
                idiom: "水滴石穿",
                zhuyin: ["ㄕㄨㄟˇ", "ㄉㄧ", "ㄕˊ", "ㄔㄨㄢ"],
                missingIndex: 3, // Missing "穿"
                meaning: "水滴不斷滴落，能把石頭滴穿。比喻堅持不懈，集小力為大力。",
                example: "只要保持耐心持續練習，總有［？］的一天。",
                category: "意志毅力"
            },
            {
                idiom: "畫蛇添足",
                zhuyin: ["ㄏㄨㄚˋ", "ㄕㄜˊ", "ㄊㄧㄢ", "ㄗㄨˊ"],
                missingIndex: 2, // Missing "添"
                meaning: "畫蛇時給它添上腳。比喻做多餘的事，反而把事情弄糟糕。",
                example: "這幅畫已經很完美了，你再補上幾筆簡直是［？］。",
                category: "成語故事"
            }
        ];

        // Game State Variables
        let currentLevel = 0;
        let score = 0;
        let streak = 0;
        let isListening = false;
        let recognition = null;
        let synth = window.speechSynthesis;

        // Initialize Web Speech Recognition if available
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'zh-TW';

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('transcriptPreview').innerText = `聽到的答案：${transcript}`;
                checkAnswer(transcript);
            };

            recognition.onend = () => {
                stopMicUI();
            };

            recognition.onerror = () => {
                stopMicUI();
            };
        } else {
            document.getElementById('speechStatus').innerText = "⚠️ 您的瀏覽器不支援語音辨識，請使用下方輸入框答題喔！";
        }

        // Initialize Game Load
        window.addEventListener('DOMContentLoaded', () => {
            loadQuestion(currentLevel);
        });

        // Load specific idiom question
        function loadQuestion(index) {
            const data = IDIOM_DATABASE[index];
            document.getElementById('levelDisplay').innerText = `${index + 1}/${IDIOM_DATABASE.length}`;
            document.getElementById('categoryBadge').innerText = `🏷️ 分類：${data.category}`;
            document.getElementById('sentenceDisplay').innerText = data.example.replace('［？］', '（ ❓ ）');
            document.getElementById('transcriptPreview').innerText = '';

            const idiomContainer = document.getElementById('idiomContainer');
            idiomContainer.innerHTML = '';

            for (let i = 0; i < data.idiom.length; i++) {
                const isMissing = (i === data.missingIndex);
                
                const card = document.createElement('div');
                card.className = `flex flex-col items-center justify-center p-3 sm:p-4 rounded-2xl border-4 transition-all ${
                    isMissing 
                    ? 'bg-amber-100 border-amber-400 border-dashed animate-pulse w-16 h-20 sm:w-20 sm:h-24' 
                    : 'bg-white border-amber-200 shadow-md w-16 h-20 sm:w-20 sm:h-24'
                }`;

                if (isMissing) {
                    card.innerHTML = `
                        <span class="text-xs font-extrabold text-amber-600 mb-1">?</span>
                        <span id="missingCharSlot" class="text-2xl sm:text-3xl font-black text-amber-600">❓</span>
                    `;
                } else {
                    card.innerHTML = `
                        <span class="text-[10px] sm:text-xs font-extrabold text-orange-600 mb-0.5">${data.zhuyin[i]}</span>
                        <span class="text-2xl sm:text-3xl font-black text-slate-800">${data.idiom[i]}</span>
                    `;
                }

                idiomContainer.appendChild(card);
            }
        }

        // Toggle Microphone Listening Mode
        function toggleVoiceRecognition() {
            if (!recognition) {
                alert("目前瀏覽器不支援語音輸入，請使用右下角手動輸入！");
                return;
            }

            if (isListening) {
                recognition.stop();
                stopMicUI();
            } else {
                try {
                    recognition.start();
                    isListening = true;
                    const micBtn = document.getElementById('micBtn');
                    const micIcon = document.getElementById('micIcon');
                    micBtn.classList.add('mic-active');
                    micIcon.className = 'fa-solid fa-wave-square animate-bounce';
                    document.getElementById('speechStatus').innerText = "🎙️ 正在聆聽中... 請唸出缺失的字！";
                } catch (e) {
                    console.log(e);
                }
            }
        }

        function stopMicUI() {
            isListening = false;
            const micBtn = document.getElementById('micBtn');
            const micIcon = document.getElementById('micIcon');
            micBtn.classList.remove('mic-active');
            micIcon.className = 'fa-solid fa-microphone';
            document.getElementById('speechStatus').innerText = "點擊大麥克風，對著手機/電腦說出缺失的字的讀音！";
        }

        // Check Answer Logic
        function checkAnswer(input) {
            const currentData = IDIOM_DATABASE[currentLevel];
            const targetChar = currentData.idiom[currentData.missingIndex];

            if (input.includes(targetChar)) {
                if (isListening) recognition.stop();
                stopMicUI();

                // Fill correct character visually
                const slot = document.getElementById('missingCharSlot');
                if (slot) {
                    slot.innerText = targetChar;
                    slot.parentElement.className = 'flex flex-col items-center justify-center p-3 sm:p-4 rounded-2xl border-4 bg-yellow-300 border-amber-500 shadow-lg glow-correct w-16 h-20 sm:w-20 sm:h-24';
                }

                // Update score & streak
                score += 100;
                streak += 1;
                document.getElementById('scoreDisplay').innerText = score;
                document.getElementById('streakDisplay').innerText = streak;

                // Fire celebration confetti
                triggerConfetti();

                // Speak success voice & popup
                speakText(`恭喜答對！成語是：${currentData.idiom}`, () => {
                    showResultModal(currentData);
                });
            }
        }

        // Manual Input Answer Submit
        function checkManualAnswer() {
            const val = document.getElementById('manualInput').value.trim();
            if (val) {
                checkAnswer(val);
                document.getElementById('manualInput').value = '';
            }
        }

        // Teacher Full TTS Reading (Child Friendly Speech Rate 0.85 & Pitch 1.15)
        function readIdiomFull() {
            const data = IDIOM_DATABASE[currentLevel];
            const textToRead = `${data.idiom}。${data.meaning}`;
            speakText(textToRead);
        }

        // Speech Helper Function
        function speakText(text, callback = null) {
            if (synth.speaking) synth.cancel();

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 0.85; // Child friendly speed
            utter.pitch = 1.15; // Pleasant tone

            if (callback) {
                utter.onend = callback;
            }

            synth.speak(utter);
        }

        // Show Hint
        function giveHint() {
            const firstChar = IDIOM_DATABASE[currentLevel].idiom[0];
            speakText(`這個成語的第一個字是：${firstChar}`);
            alert(`💡 提示：這個成語的第一個字是「${firstChar}」喔！`);
        }

        // Result Modal Popup
        function showResultModal(data) {
            const modal = document.getElementById('resultModal');
            document.getElementById('modalMeaning').innerText = `📖 成語釋義：${data.meaning}`;

            const box = document.getElementById('modalIdiomBox');
            box.innerHTML = '';

            for (let i = 0; i < data.idiom.length; i++) {
                const ruby = document.createElement('ruby');
                const rb = document.createElement('rb');
                rb.innerText = data.idiom[i];
                const rt = document.createElement('rt');
                rt.innerText = data.zhuyin[i];
                ruby.appendChild(rb);
                ruby.appendChild(rt);
                box.appendChild(ruby);
            }

            modal.classList.remove('hidden');
        }

        // Advance to next level
        function nextLevel() {
            document.getElementById('resultModal').classList.add('hidden');
            currentLevel = (currentLevel + 1) % IDIOM_DATABASE.length;
            loadQuestion(currentLevel);
        }

        // Confetti Celebration
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
